# =============================================================================
# Forecast data inventory (Phase 1 of docs/ML_Forecasting_Plan.pdf)
#
# One entry per data source, in use today or a candidate. Exit criterion of Phase 1:
# every input has an owner, a timestamp rule, a licence note and a quality note
# (checked by tests/test_forecast_data_inventory.py).
#
# status:  in_use    = the pipeline reads it today
#          candidate = proposed for a later phase, not yet used
#          gap       = needed but no live source exists
# licence.status: verified | unverified (terms not found online; read the site notice)
# vintage: does the source keep what was PUBLISHED at the time (needed for point-in-time tests)?
# History end dates are as of 2026-10-11. All times CET.
# =============================================================================
version: 1
as_of_date: "2026-10-11"
owner_default: "project owner (Praveen)"

sources:

  # ------------------------------------------------------------------ in use
  - id: omie_da
    status: in_use
    provider: "OMIE (MIBEL market operator)"
    content: "Day-ahead clearing prices, Portugal and Spain (hourly; 15-minute from 2025-10-01)"
    access: {method: "file download", url: "https://www.omie.es/sites/default/files/dados/AGNO_<YYYY>/MES_<MM>/TXT/ (marginalpdbc files)", auth: none}
    resolution: ["hourly to 2025-09-30", "15-minute from 2025-10-01"]
    publication: "result for day D published D-1 ~12:45 (SDAC coupling); confirm empirically from load logs"
    history: {start: "2020-01-01", end: "2026-10-10"}
    live_feed: true
    loader: phase_1_da_day_ahead_bidding/da_price_pv_inflow_forecasting/omie_da_price_loader.py
    stored_in: ["da_training_data_2020_2026.xlsx", "da_training_data_isp_2025_2026.xlsx"]
    licence: {status: unverified, note: "public download, no key; read the 'Aviso legal' in the omie.es footer for reuse and citation terms"}
    cost: free
    rate_limits: "none documented; the loader fetches one file per day"
    vintage: partial   # results are final at publication; no revisions seen, but old files are overwritten only by OMIE
    used_by: [da_price, ida1_price, ida2_price, ida3_price, xbid_price, afrr_cap_price, mfrr_price]
    owner: "project owner (Praveen)"
    quality_note: "all rows OMIE_LIVE; PT equals ES price in 93.4% of hours (market coupling); file stores exactly 24 (96) slots per day, so the 23- and 25-hour daylight-saving days are not represented as such (Phase 2)"
    findings: [D5]

  - id: omie_ida
    status: in_use
    provider: "OMIE / SIDC"
    content: "Intraday auction clearing prices IDA1, IDA2, IDA3 (marginalpibcpt files, session 01/02/03)"
    access: {method: "file download", url: "https://www.omie.es/es/file-download?parents=marginalpibcpt&filename=marginalpibcpt_<YYYYMMDD><SS>.1", auth: none}
    resolution: ["hourly"]
    publication: "IDA1 D-1 ~15:30, IDA2 D-1 ~22:30, IDA3 D ~10:30; confirm empirically"
    history: {start: "2024-06-13", end: "2026-10-09"}
    live_feed: true
    loader: "phase_2{a,b,c}_*/ida*_price_forecasting/omie_ida*_price_loader.py"
    stored_in: ["ida1_training_data_2024_2025.xlsx", "ida2_training_data_2024_2025.xlsx", "ida3_training_data_2024_2025.xlsx"]
    licence: {status: unverified, note: "same as omie_da"}
    cost: free
    rate_limits: "none documented"
    vintage: partial
    used_by: [ida1_price, ida2_price, ida3_price]
    owner: "project owner (Praveen)"
    quality_note: "SYNTHETIC rows inside the files: IDA1 7.8%, IDA2 2.1%, IDA3 1.7% (days OMIE published empty files); three-session regime only from 2024-06-13"
    findings: [D5]

  - id: omie_xbid
    status: in_use
    provider: "OMIE (continuous market summary)"
    content: "Continuous intraday per-period min/max/volume-weighted mean price; the Portuguese weighted mean (MedioPT) is used"
    access: {method: "file download", url: "https://www.omie.es/es/file-download?parents=precios_pibcic&filename=<file>", auth: none}
    resolution: ["hourly"]
    publication: "published after delivery; the forecast at a window uses earlier days only"
    history: {start: "2024-06-13", end: "2026-10-09"}
    live_feed: true
    loader: phase_2d_xbid_continuous_intraday/xbid_price_forecasting/xbid_price_loader.py
    stored_in: ["xbid_training_data_2024_2025.xlsx"]
    licence: {status: unverified, note: "same as omie_da; the free summary is not the order book (order-book depth needs a commercial EPEX SPOT subscription)"}
    cost: free
    rate_limits: "none documented"
    vintage: no
    used_by: [xbid_price]
    owner: "project owner (Praveen)"
    quality_note: "0.7% SYNTHETIC (hours without trades); no intra-day price path, only one summary per hour"
    findings: [D5]

  - id: ren_reserve_prices
    status: in_use
    provider: "REN (Portuguese TSO), mercado.ren.pt website API"
    content: "aFRR band price (BaFRRPreco, up and down), mFRR price series (MFRRPreco, the activation energy price), imbalance price (DesvioPreco, includes the day-ahead reference)"
    access: {method: "JSON over HTTPS", url: "https://mercadoservices.ren.pt/api/<Service>/Get<Service>?language=PT&dayQuery=<D>&monthQuery=<M>&yearQuery=<Y>", auth: "static key (X-ApiKey) copied from REN's own web pages"}
    resolution: ["15-minute (96 per day), averaged to hourly by the loaders"]
    publication: "not documented; band results are published after the market session"
    history: {start: "2019-01-01 (aFRR); 2024-11-27 (mFRR)", end: "2026-10-09"}
    live_feed: true
    loader: "phase_3{a,b}_*/**/*_price_loader.py, phase_5c_*/ren_imbalance_price_loader.py"
    stored_in: ["afrr_training_data_2019_2025.xlsx", "mfrr_training_data_2024_2025.xlsx"]
    licence: {status: unverified, note: "no published terms found; this is the website's internal API, not a documented public API, so it can change or be blocked without notice"}
    cost: free
    rate_limits: "unknown"
    vintage: no
    used_by: [afrr_cap_price, mfrr_price]
    owner: "project owner (Praveen)"
    quality_note: "aFRR 0.1% and mFRR 2.2% SYNTHETIC rows; the aFRR product changes: national aFRR platform rules apply from 2026-04-01 and PICASSO integration is due by 2026-10-31, so the series has a regime change; REN's 'Ajustado' price is preferred over 'Inicial'"
    findings: [D3, D5]

  - id: pv_weather_history
    status: in_use
    provider: "unknown (file labelled PLANT_SENSOR)"
    content: "Hourly global horizontal irradiance GHI (W/m2) and ambient temperature (C), Alqueva"
    access: {method: "static Excel file, no downloader in the code", url: none, auth: none}
    resolution: ["hourly"]
    publication: "none: there is no live feed; recent days are filled by a synthetic generator (_fill_gaps)"
    history: {start: "2015-01-01", end: "2026-06-30 (real); 2026-07-01 to 2027-03-14 synthetic"}
    live_feed: false
    loader: "none (phase_1_da_day_ahead_bidding/da_price_pv_inflow_forecasting/pv_power_forecaster.py only reads and gap-fills)"
    stored_in: ["pv_training_data_from_2015.xlsx"]
    licence: {status: unverified, note: "origin unknown, so the licence is unknown"}
    cost: unknown
    rate_limits: n/a
    vintage: no
    used_by: [pv_weather]
    owner: "project owner (Praveen)"
    quality_note: "The label PLANT_SENSOR cannot be literal before mid-2022 (the floating PV pilot was inaugurated in July 2022); daily July GHI varies by only 11% (std/mean), so the data may be reanalysis or modelled. The last 3.3 months and the future rows are synthetic (clear-sky times a constant cloud factor)"
    findings: [D1, D2]

  - id: inflow_history
    status: in_use
    provider: "unknown ('Alqueva Reservoir Inflow - Guadiana River Research Dataset')"
    content: "Daily natural inflow into the Alqueva reservoir (m3/h)"
    access: {method: "static Excel file, no downloader in the code", url: none, auth: none}
    resolution: ["daily"]
    publication: "none: no live feed; later days are filled with monthly climatology"
    history: {start: "2015-01-01", end: "2026-06-30 (research data); 174 climatology rows after"}
    live_feed: false
    loader: "none (reservoir_inflow_forecaster.py only reads and gap-fills)"
    stored_in: ["inflow_training_data_from_2015.xlsx"]
    licence: {status: unverified, note: "origin unknown"}
    cost: unknown
    rate_limits: n/a
    vintage: no
    used_by: [reservoir_inflow]
    owner: "project owner (Praveen)"
    quality_note: "real-looking spread (monthly std 20-65% of the mean, flood peaks to 5 million m3/h); inflow is not measured directly at Alqueva, so the series is itself an estimate; the dataset ends on the same day as the PV weather file, which suggests one bulk export"
    findings: [D1, D2]

