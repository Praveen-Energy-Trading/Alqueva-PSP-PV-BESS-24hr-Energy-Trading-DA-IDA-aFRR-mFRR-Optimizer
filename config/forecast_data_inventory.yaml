# -----------------------------------------------------------------------------
# Findings of the Phase 1 data audit
# -----------------------------------------------------------------------------
findings:
  D1: {severity: high,   fix_in_phase: 2,  summary: "PV weather and inflow have no live feed: the real data end on 2026-06-30 and every later row is synthetic or climatology, so recent training history and the PV 'actuals' are not real"}
  D2: {severity: medium, fix_in_phase: 2,  summary: "PV weather history has unknown provenance (label PLANT_SENSOR for 2015 onward cannot be literal); replace or validate against NASA POWER or PVGIS/CAMS, and start archiving weather forecasts with their issue time"}
  D3: {severity: medium, fix_in_phase: 2,  summary: "REN data come from the website's internal API with a static key and no published terms or service level; build a monitored loader with a stored raw copy"}
  D4: {severity: medium, fix_in_phase: 2,  summary: "No fundamentals are collected (load, wind and solar forecasts, gas, carbon, reservoir levels); the free candidates are ENTSO-E (token), ESIOS (token), REN Data Hub, NASA POWER, PVGIS/CAMS"}
  D5: {severity: medium, fix_in_phase: 2,  summary: "Stored files force 24 (or 96) slots per day, so daylight-saving days with 23 or 25 hours are not represented as such; raw downloads are not kept, so the fix needs a rebuild from the source"}
  D6: {severity: medium, fix_in_phase: 2,  summary: "No source keeps vintages (what was published at the time); our own forecasts are not archived either, so point-in-time evaluation of features and of past forecasts is not yet possible"}
