# =============================================================================
# Roll-out of the model-development process to every price target (stage 9 of docs/Model_Development_Plan.pdf)
#
# Each target is processed with the same steps (tune, compare, select, lock-test, register, monitor). What differs between
# targets is only what their data allows, and it is written here so that no target is treated differently by accident:
#
#   standard           the rules of config/evaluation.yaml and config/model_selection.yaml, unchanged
#   limited_evidence   for targets whose history is too short for the standard rules (IDA1-3 and XBID start on 2024-06-13):
#                      fewer training days before the first test day, an expanding training window, and a lower minimum number of
#                      scored development days. The shorter evidence is labelled in every decision and report: tests have fewer
#                      days, so only larger differences can be established.
#   very_limited_evidence
#                      for a target with still less history (mFRR starts on 2024-11-27): 150 training days before the first
#                      validation day (the three tuning blocks of 30 days still leave 60 days to train on), an expanding
#                      window and at least 120 scored development days. Every step of the process is run and nothing is
#                      skipped; the evidence is small and the label on every decision and report says so.
#   deferred           no data to run the process honestly. No target is deferred today; the treatment stays for a target whose
#                      history is too short even for very_limited_evidence.
#
# The first test day of a limited_evidence target is the first day with `min_train_days` of history (computed from the data,
# never chosen by hand). Locked-test outcome coverage is required to be at least the share of days with outcomes during
# development minus `availability_margin` (a few auctions are legitimately empty), never more than `max_truth_share`.
# `feature_set` is the set of features each target is built from (XBID may use data up to D-2 and mFRR up to D-3, so they
# cannot use yesterday's price; see config/feature_sets.yaml).
# =============================================================================
version: 1

treatments:
  standard:
    description: "evidence rules unchanged"
  limited_evidence:
    description: "short history: 180 training days before the first validation day, expanding window, at least 250 scored development days"
    schedule: {min_train_days: 180, train_window_days: null}
    selection: {min_days: 250}
  very_limited_evidence:
    description: "very short history: 150 training days before the first validation day, expanding window, at least 120 scored development days"
    schedule: {min_train_days: 150, train_window_days: null}
    selection: {min_days: 120}
  deferred:
    description: "not enough history to run the process honestly"

availability:
  availability_margin: 0.03
  max_truth_share: 0.99

targets:
  da_price:       {treatment: standard,         feature_set: baseline_v1}
  afrr_cap_price: {treatment: standard,         feature_set: baseline_v1}
  afrr_dn_price:  {treatment: standard,         feature_set: baseline_v1}
  ida1_price:     {treatment: limited_evidence, feature_set: baseline_v1}
  ida2_price:     {treatment: limited_evidence, feature_set: baseline_v1}
  ida3_price:     {treatment: limited_evidence, feature_set: baseline_v1}
  xbid_price:     {treatment: limited_evidence, feature_set: baseline_e2_v1}
  mfrr_price:     {treatment: very_limited_evidence, feature_set: baseline_e3_v1}
