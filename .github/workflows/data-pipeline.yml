name: data-pipeline

# NOTE: these tests are run on the author's own PC, not on GitHub. This workflow is manual-only (workflow_dispatch):
# it no longer starts on push, pull request or schedule, and can still be started by hand from the Actions tab.

# Phase 1 (daily data pipeline): runs its tests and the OFFLINE demo on every change to the pipeline,
# and publishes the demo's data-quality report in the run summary. The demo replays real saved files of
# the 25-hour day 2025-10-26 (100 quarter-hours) through all eight sources, so nothing here touches the
# network or needs a market-data licence.
#
# The scheduled run (weekly) catches breakage from library updates when nobody has pushed.

on:
  workflow_dispatch:

jobs:
  data-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Data-layer, data-quality and pipeline tests
        run: python -m pytest tests/test_data_layer.py tests/test_data_quality.py tests/test_phase1_pipeline.py -v

      - name: Offline demo of the daily pipeline
        run: python phase_1_data_pipeline/run_data_pipeline.py --demo --workdir demo_out

      - name: Publish the data-quality report in the run summary
        run: cat demo_out/reports/data_quality_*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the demo zones and report
        uses: actions/upload-artifact@v4
        with:
          name: data-pipeline-demo
          path: demo_out/
          retention-days: 30
