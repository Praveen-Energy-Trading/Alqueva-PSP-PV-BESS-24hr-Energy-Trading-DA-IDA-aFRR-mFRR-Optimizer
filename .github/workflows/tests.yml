name: tests

# Runs the full pytest suite on every push/PR. CI runners have no CPLEX
# license (it's commercial software), so the model-solving "integration"
# tests skip gracefully rather than fail -- that's the test suite's own
# existing design (tests/conftest.py: `cfg.solver.resolve_executable() is
# None` -> pytest.skip), not something this workflow adds. CI's real job
# here is to guarantee the non-solver-dependent code (config loading,
# scenario generation, checkers, formatters, forecasters' non-model logic)
# never silently regresses, on every push, without needing a licensed
# solver to do it. Anyone running locally with CPLEX installed (or the free
# HiGHS/CBC fallback already wired in config/solver.yaml) gets full
# solver-backed coverage -- see README / config/solver.yaml.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v --durations=10

      - name: Compile-check every Python file
        run: python -m py_compile $(git ls-files '*.py')
